; Second Vision — ESP32 physical control panel
;
; Several build environments share one source folder. build_src_filter picks
; which file compiles, so the sketches live side by side without a second
; project:
;
;   pio run -e polarity  -t upload    bring-up: prints raw pin states
;   pio run -e panel     -t upload    the real panel firmware
;   pio run -e bench     -t upload    panel firmware, pot compiled out
;   pio run -e motorlink -t upload    Pi <-> ESP32 motor link
;
; In VS Code, switch environments from the PlatformIO toolbar at the bottom.

[platformio]
default_envs = panel
src_dir = src

[env]
platform  = espressif32
board     = esp32dev              ; generic ESP32-WROOM devkit (30- and 38-pin)
framework = arduino

; Must match _open_config_port() in
; src/second_vision/workers/config_reader.py. The ESP32's own boot log is
; emitted at 115200, so expect a burst of garbage on reset — that is the ROM
; bootloader, not a baud mismatch in your code.
monitor_speed = 9600
; 115200, not 921600. Verified on the real board (ESP32-D0WD-V3 rev 3.1): chip
; identification succeeds at the handshake, then BOTH 921600 and 460800 die the
; moment esptool switches to the high rate for the stub —
;   "A fatal error occurred: Serial data stream stopped: Possible serial noise
;    or corruption."
; 115200 writes the whole image in ~14 s. Slow is not the problem; a flash that
; fails two thirds of the time is.
;
; This DevKit's auto-reset is also unreliable: hold IO0 for the ENTIRE upload,
; not just at the start. Releasing early gives "Wrong boot mode detected (0x13)"
; or "No serial data received"; holding EN by mistake gives the latter too.
upload_speed  = 115200

; Decodes stack traces into file:line if the firmware ever panics.
monitor_filters = esp32_exception_decoder

build_flags = -Wall

; Pinned to USB on purpose. The Pi always has /dev/ttyAMA10 (its own GPIO14/15
; UART, where the panel lives at runtime), and bare auto-detection picks it —
; esptool then spends ~11s handshaking with a port that has no ESP32 behind it
; and the build reports FAILED. The glob matches the USB-serial adapter only,
; and survives the number changing when the motor board is plugged in too.
upload_port  = /dev/ttyUSB*
monitor_port = /dev/ttyUSB*

[env:panel]
; Deployment build: real controls, pot fitted.
build_src_filter = -<*> +<control_panel.cpp>

[env:polarity]
build_src_filter = -<*> +<polarity_test.cpp>

[env:bench]
; Laptop testing with a bare board and no breadboard.
;
; Same firmware as `panel` with the potentiometer compiled out. GPIO34 is
; input-only with no internal pull-up, so an unfitted pot floats and the
; 80-count deadband — sized for a wired pot's dither — is exceeded constantly:
; ~1,625 spurious S:motor_strength lines measured in a 30 s window, about 54/s,
; which saturates the 9600 link on both transports.
;
; Everything else is byte-identical to `panel`, so this exercises the real
; emission path rather than a simulation of it.
build_src_filter = -<*> +<control_panel.cpp>
build_flags = ${env.build_flags} -D HAVE_POT=0

[env:motorlink]
; Pi -> ESP32 motor link. The counterpart to serial_worker.py on the Pi:
; reads the 0xAA start byte off UART2 and answers with the 0xAA 0xFF <byte>
; prefix that ACK_PREFIX in serial_worker.py matches on.
;
; Note the baud: 115200, not the 9600 the panel envs use. This is a different
; link on a different board — the panel talks one-way to the Pi's config
; reader, this one is the bidirectional motor channel. Overrides the [env]
; monitor_speed accordingly.
;
;   pio run -e motorlink -t upload
build_src_filter = +<esp32_motor_controller.cpp>
monitor_speed = 115200