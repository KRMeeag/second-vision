<text x="1164" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">40</text>
<text x="108" y="688" font-size="9.5" fill="#991b1b" text-anchor="start" font-weight="bold">PIN 1 is the only SQUARE pad — find it, then count.</text>
<path d="M 240 228 L 310 228 L 310 450 L 678 450 L 678 560" stroke="#16a34a" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="240" cy="228" r="5.5" fill="#16a34a"/>
<circle cx="678" cy="560" r="5.5" fill="#16a34a"/>
<text x="24" y="742" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">THE WIRES</text>
<text x="40" y="764" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="bold">FROM</text>
<text x="250" y="764" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="bold">TO</text>
<text x="560" y="764" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="bold">why</text>
<line x1="24" y1="778" x2="1216" y2="778" stroke="#e5e7eb"/>
<rect x="24" y="786" width="11" height="11" rx="2" fill="#dc2626"/>
<text x="40" y="796" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">X1202  5V</text>
<text x="250" y="796" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">ESP32 5V pin</text>
<text x="560" y="796" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">38-pin board. Labelled VIN on 30-pin boards</text>
<line x1="24" y1="806" x2="1216" y2="806" stroke="#e5e7eb"/>
<rect x="24" y="814" width="11" height="11" rx="2" fill="#111827"/>
<text x="40" y="824" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">X1202  GND</text>
<text x="250" y="824" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">ESP32 GND</text>
<text x="560" y="824" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">also the Pi's ground: same node</text>
<line x1="24" y1="834" x2="1216" y2="834" stroke="#e5e7eb"/>
<rect x="24" y="842" width="11" height="11" rx="2" fill="#16a34a"/>
<text x="40" y="852" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">ESP32  GPIO23</text>
<text x="250" y="852" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">Pi PIN 21  (GPIO9 · uart3-pi5 RX)</text>
<text x="560" y="852" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">panel data → Pi.  NOT pin 10 — that is the motor link</text>
<rect x="24" y="866" width="388" height="116" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
<text x="37" y="887" font-size="10" fill="#991b1b" text-anchor="start" font-weight="bold">THIS KILLS THE BOARD</text>
<text x="37" y="906" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">• CHECK POLARITY with a meter before connecting the</text>
<text x="37" y="920" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">   XH2.54. Reversed 5 V and GND destroys the ESP32.</text>
<text x="37" y="934" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">• 5 V to the ESP32's 5V pin ONLY. Never its 3V3 pin (that</text>
<text x="37" y="948" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">   bypasses the regulator), never a Pi GPIO (3.3 V only).</text>
<text x="37" y="962" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">• TWO separate protoboard rails: 5V in, and 3V3 out of the</text>
<text x="37" y="976" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">   ESP32 feeding the pot. NEVER join them.</text>
<rect x="428" y="866" width="388" height="116" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
<text x="441" y="887" font-size="10" fill="#1e3a8a" text-anchor="start" font-weight="bold">WHY GPIO23, NOT GPIO1</text>
<text x="441" y="906" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">GPIO1 is UART0 TX — the ESP32's USB serial. The ROM</text>
<text x="441" y="920" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">bootloader dumps its 115200 log there on EVERY reset,</text>
<text x="441" y="934" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">which would land straight in the Pi's parser.</text>
<text x="441" y="948" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal"></text>
<text x="441" y="962" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">GPIO23 is UART2: the Pi never sees it, and USB stays free</text>
<text x="441" y="976" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">for flashing and monitoring at the same time.</text>
<rect x="832" y="866" width="384" height="116" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
<text x="845" y="887" font-size="10" fill="#78350f" text-anchor="start" font-weight="bold">WHY NOT PINS 8/10</text>
<text x="845" y="906" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">The primary UART (/dev/serial0) is taken by the</text>
<text x="845" y="920" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">motor-controller ESP32-C3 on pins 6/8/10.</text>
<text x="845" y="934" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal"></text>
<text x="845" y="948" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">The panel gets uart3-pi5 instead — add</text>
<text x="845" y="962" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">dtoverlay=uart3-pi5 to config.txt, then reboot.</text>
<text x="845" y="976" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">GPIO9 is also SPI0 MISO: free only while SPI stays off.</text>
</svg>