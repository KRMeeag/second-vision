<text x="894" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">30</text>
<circle cx="948" cy="560" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="948" y="564" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">31</text>
