<text x="948" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">32</text>
<circle cx="1002" cy="560" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1002" y="564" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">33</text>
<circle cx="1002" cy="606" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1002" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">34</text>
<circle cx="1056" cy="560" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1056" y="564" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">35</text>
<circle cx="1056" cy="606" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1056" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">36</text>
<circle cx="1110" cy="560" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1110" y="564" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">37</text>
<circle cx="1110" cy="606" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1110" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">38</text>
<circle cx="1164" cy="560" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="1164" y="564" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">39</text>
