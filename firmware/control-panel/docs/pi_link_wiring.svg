<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1240" height="840" fill="#ffffff"/>
<text x="24" y="36" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Second Vision — ESP32 → Raspberry Pi 5 link</text>
<text x="24" y="58" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Power from the X1202's XH2.54 header. Only ONE wire touches the Pi's GPIO header.</text>
<rect x="662" y="160" width="372" height="108" rx="8" fill="#111827"/>
<text x="662" y="146" font-size="11" fill="#111827" text-anchor="start" font-weight="bold">Pi 40-PIN HEADER   (first 10 pins)</text>
<rect x="688" y="178" width="24" height="24" rx="2" fill="#4b5563" stroke="#1f2937"/>
<text x="700" y="195" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="bold">1</text>
<text x="700" y="171" font-size="8.5" fill="#cbd5e1" text-anchor="middle" font-weight="normal">3V3</text>
<circle cx="700" cy="248" r="12" fill="#4b5563" stroke="#1f2937"/>
<text x="700" y="253" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="700" y="226" font-size="8" fill="#cbd5e1" text-anchor="middle" font-weight="normal">5V</text>
<rect x="762" y="178" width="24" height="24" rx="12" fill="#4b5563" stroke="#1f2937"/>
<text x="774" y="195" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="bold">3</text>
<text x="774" y="171" font-size="8.5" fill="#cbd5e1" text-anchor="middle" font-weight="normal">GPIO2</text>
<circle cx="774" cy="248" r="12" fill="#4b5563" stroke="#1f2937"/>
<text x="774" y="253" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="774" y="226" font-size="8" fill="#cbd5e1" text-anchor="middle" font-weight="normal">5V</text>
<rect x="836" y="178" width="24" height="24" rx="12" fill="#4b5563" stroke="#1f2937"/>
<text x="848" y="195" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="bold">5</text>
<text x="848" y="171" font-size="8.5" fill="#cbd5e1" text-anchor="middle" font-weight="normal">GPIO3</text>
<circle cx="848" cy="248" r="12" fill="#4b5563" stroke="#1f2937"/>
<text x="848" y="253" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="848" y="226" font-size="8" fill="#cbd5e1" text-anchor="middle" font-weight="normal">GND</text>
<rect x="910" y="178" width="24" height="24" rx="12" fill="#4b5563" stroke="#1f2937"/>
<text x="922" y="195" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="bold">7</text>
<text x="922" y="171" font-size="8.5" fill="#cbd5e1" text-anchor="middle" font-weight="normal">GPIO4</text>
<circle cx="922" cy="248" r="12" fill="#4b5563" stroke="#1f2937"/>
<text x="922" y="253" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<text x="922" y="226" font-size="8" fill="#cbd5e1" text-anchor="middle" font-weight="normal">GPIO14 TXD</text>
<rect x="984" y="178" width="24" height="24" rx="12" fill="#4b5563" stroke="#1f2937"/>
<text x="996" y="195" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="bold">9</text>
<text x="996" y="171" font-size="8.5" fill="#cbd5e1" text-anchor="middle" font-weight="normal">GND</text>
<circle cx="996" cy="248" r="12" fill="#16a34a" stroke="#ffffff" stroke-width="2.5"/>
<text x="996" y="253" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text>
<text x="996" y="226" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">GPIO15 RXD</text>
<text x="1048" y="195" font-size="20" fill="#9ca3af" text-anchor="middle" font-weight="normal">…</text>
<text x="1048" y="253" font-size="20" fill="#9ca3af" text-anchor="middle" font-weight="normal">…</text>
<rect x="330" y="92" width="316" height="80" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
<text x="343" y="113" font-size="9.5" fill="#991b1b" text-anchor="start" font-weight="bold">FIND PIN 1 BEFORE YOU COUNT</text>
<text x="343" y="130" font-size="8.6" fill="#991b1b" text-anchor="start" font-weight="normal">It is the only SQUARE pad on the header.</text>
<text x="343" y="145" font-size="8.6" fill="#991b1b" text-anchor="start" font-weight="normal">Nearest the USB-C power connector.</text>
<text x="343" y="160" font-size="8.6" fill="#991b1b" text-anchor="start" font-weight="normal">Pin 2 sits beside pin 1, in the other row.</text>
<path d="M 646 132 L 648 184" stroke="#fca5a5" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
<rect x="110" y="150" width="190" height="210" rx="6" fill="#1f2937"/>
<rect x="153" y="168" width="104" height="70" rx="3" fill="#9ca3af"/>
<text x="205" y="209" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">ESP-32</text>
<circle cx="300" cy="300" r="7.5" fill="#16a34a"/>
<text x="286" y="303" font-size="10" fill="#f9fafb" text-anchor="end" font-weight="bold">TX0 / GPIO1</text>
<text x="286" y="317" font-size="8" fill="#9ca3af" text-anchor="end" font-weight="normal">j15 on the breadboard</text>
<circle cx="172" cy="360" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="172" y="346" font-size="9" fill="#f9fafb" text-anchor="middle" font-weight="bold">VIN</text>
<circle cx="242" cy="360" r="7.5" fill="#111827" stroke="#ffffff" stroke-width="2"/>
<text x="242" y="346" font-size="9" fill="#f9fafb" text-anchor="middle" font-weight="bold">GND</text>
<rect x="110" y="470" width="190" height="86" rx="6" fill="#334155"/>
<text x="205.0" y="510" font-size="12" fill="#f9fafb" text-anchor="middle" font-weight="bold">X1202 UPS</text>
<text x="205.0" y="528" font-size="8.5" fill="#cbd5e1" text-anchor="middle" font-weight="normal">XH2.54 5V output</text>
<text x="205.0" y="574" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal">powers the Pi → this GND IS the Pi's GND</text>
<circle cx="172" cy="470" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="172" y="492" font-size="9" fill="#f9fafb" text-anchor="middle" font-weight="bold">5V</text>
<circle cx="242" cy="470" r="7.5" fill="#111827" stroke="#ffffff" stroke-width="2"/>
<text x="242" y="492" font-size="9" fill="#f9fafb" text-anchor="middle" font-weight="bold">GND</text>
<path d="M 172 470 L 172 360" stroke="#dc2626" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="172" cy="470" r="5.5" fill="#dc2626"/>
<circle cx="172" cy="360" r="5.5" fill="#dc2626"/>
<path d="M 242 470 L 242 360" stroke="#111827" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="242" cy="470" r="5.5" fill="#111827"/>
<circle cx="242" cy="360" r="5.5" fill="#111827"/>
<path d="M 300 300 L 460 300 L 460 420 L 996 420 L 996 248" stroke="#16a34a" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="300" r="5.5" fill="#16a34a"/>
<circle cx="996" cy="248" r="5.5" fill="#16a34a"/>
<text x="24" y="600" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">THE WIRES</text>
<text x="40" y="622" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="bold">FROM</text>
<text x="250" y="622" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="bold">TO</text>
<text x="520" y="622" font-size="9" fill="#9ca3af" text-anchor="start" font-weight="bold">why</text>
<line x1="24" y1="636" x2="1216" y2="636" stroke="#e5e7eb"/>
<rect x="24" y="644" width="11" height="11" rx="2" fill="#dc2626"/>
<text x="40" y="654" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">X1202  5V</text>
<text x="250" y="654" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">ESP32 VIN</text>
<text x="520" y="654" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">power in — never into a Pi GPIO</text>
<line x1="24" y1="664" x2="1216" y2="664" stroke="#e5e7eb"/>
<rect x="24" y="672" width="11" height="11" rx="2" fill="#111827"/>
<text x="40" y="682" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">X1202  GND</text>
<text x="250" y="682" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">ESP32 GND</text>
<text x="520" y="682" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">also the Pi's ground: same node, shared reference</text>
<line x1="24" y1="692" x2="1216" y2="692" stroke="#e5e7eb"/>
<rect x="24" y="700" width="11" height="11" rx="2" fill="#16a34a"/>
<text x="40" y="710" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">ESP32  TX0 / GPIO1</text>
<text x="250" y="710" font-size="10.5" fill="#111827" text-anchor="start" font-weight="bold">Pi pin 10  (GPIO15 · RXD)</text>
<text x="520" y="710" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal">panel data → Pi</text>
<rect x="24" y="720" width="388" height="106" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
<text x="37" y="741" font-size="10" fill="#991b1b" text-anchor="start" font-weight="bold">THIS KILLS PINS</text>
<text x="37" y="760" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">• The X1202's 5V goes to ESP32 VIN and NOWHERE else.</text>
<text x="37" y="774" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">   Pi GPIO is 3.3 V and not 5 V tolerant.</text>
<text x="37" y="788" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">• Never into the ESP32's 3V3 pin either — that bypasses</text>
<text x="37" y="802" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">   its regulator and puts 5 V on the module.</text>
<text x="37" y="816" font-size="8.4" fill="#991b1b" text-anchor="start" font-weight="normal">• Pin 8 is the Pi's TXD: land there and you get silence.</text>
<rect x="428" y="720" width="388" height="106" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
<text x="441" y="741" font-size="10" fill="#1e3a8a" text-anchor="start" font-weight="bold">WHY ONE WIRE TO THE Pi</text>
<text x="441" y="760" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">The X1202 feeds the Pi, so its GND and the Pi's GND are</text>
<text x="441" y="774" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">electrically one node. Grounding the ESP32 at the X1202</text>
<text x="441" y="788" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">already references it to the Pi — no separate ground wire</text>
<text x="441" y="802" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">to pin 6 is needed. Adding one is harmless (same node) but</text>
<text x="441" y="816" font-size="8.4" fill="#1e3a8a" text-anchor="start" font-weight="normal">buys nothing at 9600 baud over this distance.</text>
<rect x="832" y="720" width="384" height="106" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
<text x="845" y="741" font-size="10" fill="#78350f" text-anchor="start" font-weight="bold">WHEN FLASHING OVER USB</text>
<text x="845" y="760" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">Unplug the X1202 5V from VIN first. Devkits tolerate USB</text>
<text x="845" y="774" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">and VIN together via a diode, but powering from both is</text>
<text x="845" y="788" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">not worth the risk for the sake of one connector.</text>
<text x="845" y="802" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal"></text>
<text x="845" y="816" font-size="8.4" fill="#78350f" text-anchor="start" font-weight="normal">The signal wire can stay connected throughout.</text>
</svg>