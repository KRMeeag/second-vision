<text x="840" y="564" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">27</text>
<circle cx="840" cy="606" r="11" fill="#4b5563" stroke="#1f2937"/>
<text x="840" y="610" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold">28</text>
