<text x="24" y="36" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Second Vision — control panel → Raspberry Pi 5</text>
<text x="24" y="58" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">ONE wire. The panel only transmits, and ground is already common through the X1202.</text>
