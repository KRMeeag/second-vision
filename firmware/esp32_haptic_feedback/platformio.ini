[platformio]
src_dir = src
include_dir = include

[env:esp32c3_haptics]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; DFRobot_BMI160 is vendored under lib/DFRobot_BMI160 with a local fix to
    ; I2cGetRegs() (see lib/DFRobot_BMI160/DFRobot_BMI160.cpp) — it silently
    ; reported I2C read failures as success, which broke this project's
    ; imuHealthy/brownout recovery logic. Do not re-add the registry package,
    ; it would shadow or conflict with the vendored copy.